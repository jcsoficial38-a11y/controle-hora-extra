<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f0f9ff" stop-opacity="0.7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1e3a8a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background circle with soft rounded rect or circle -->
  <rect width="512" height="512" rx="128" fill="url(#blueGrad)" />

  <!-- Outer clock ring track -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#93c5fd" stroke-width="8" stroke-dasharray="4 8" opacity="0.6" />
  
  <!-- Clock bezel container -->
  <circle cx="256" cy="256" r="156" fill="#ffffff" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="148" fill="url(#innerGlow)" />

  <!-- Hour notches -->
  <line x1="256" y1="120" x2="256" y2="134" stroke="#2563eb" stroke-width="5" stroke-linecap="round" />
  <line x1="256" y1="378" x2="256" y2="392" stroke="#2563eb" stroke-width="5" stroke-linecap="round" />
  <line x1="120" y1="256" x2="134" y2="256" stroke="#2563eb" stroke-width="5" stroke-linecap="round" />
  <line x1="378" y1="256" x2="392" y2="256" stroke="#2563eb" stroke-width="5" stroke-linecap="round" />
  
  <line x1="160" y1="160" x2="170" y2="170" stroke="#93c5fd" stroke-width="4" stroke-linecap="round" />
  <line x1="352" y1="160" x2="342" y2="170" stroke="#93c5fd" stroke-width="4" stroke-linecap="round" />
  <line x1="160" y1="352" x2="170" y2="342" stroke="#93c5fd" stroke-width="4" stroke-linecap="round" />
  <line x1="352" y1="352" x2="342" y2="342" stroke="#93c5fd" stroke-width="4" stroke-linecap="round" />

  <!-- Minimalist Clock Hands -->
  <!-- Hour hand pointing to 10 o'clock -->
  <line x1="256" y1="256" x2="200" y2="190" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round" />
  <!-- Minute hand pointing to 2 o'clock -->
  <line x1="256" y1="256" x2="330" y2="195" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />

  <!-- Dynamic extra time accent arc (+ overtime indicator) -->
  <path d="M 256 100 A 156 156 0 0 1 405 220" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" />

  <!-- Center badge with HE -->
  <circle cx="256" cy="275" r="54" fill="#1e40af" />
  <circle cx="256" cy="275" r="48" fill="#2563eb" />
  
  <text x="256" y="287" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="1">HE</text>

  <!-- Small center pin -->
  <circle cx="256" cy="256" r="6" fill="#ffffff" />
</svg>
